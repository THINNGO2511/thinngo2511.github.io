<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edward Ngo</title>
  <meta name="robots" content="noindex">
  <script>
    // The site lives at the root now. Old links from the previous address
    // (/Personal_Portfolio/...) and old routes (/about, /contact) land on the
    // matching section of the one page.
    (function () {
      var path = location.pathname.toLowerCase();
      var legacy = '/personal_portfolio';
      if (path.indexOf(legacy) === 0) path = path.slice(legacy.length);
      var rest = path.replace(/^\/+|\/+$/g, '');
      var hash = { about: '#about', career: '#career', portfolio: '#career', contact: '#contact' }[rest] || '';
      location.replace('/' + hash);
    })();
  </script>
</head>
<body style="background:#313131;color:#dfdfdf;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif">
  <p style="padding:24px">Redirecting… <a style="color:#ffd700" href="/">Go home</a></p>
</body>
</html>
