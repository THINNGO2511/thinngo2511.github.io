<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edward Ngo</title>
  <meta name="robots" content="noindex">
  <script>
    // Old routes (/about, /contact) and anything else → the one-page site.
    (function () {
      var path = location.pathname;
      var marker = '/Personal_Portfolio/';
      var at = path.indexOf(marker);
      var base = at >= 0 ? path.slice(0, at + marker.length) : '/';
      var rest = (at >= 0 ? path.slice(at + marker.length) : path.slice(1)).replace(/\/+$/, '').toLowerCase();
      // everything lives on one page now; old routes jump to their section
      var hash = { about: '#about', career: '#career', portfolio: '#career', contact: '#contact' }[rest] || '';
      location.replace(base + hash);
    })();
  </script>
</head>
<body style="background:#0a0a0b;color:#ecebe7;font-family:ui-monospace,Menlo,monospace">
  <p style="padding:24px">Redirecting… <a style="color:#ff5a1f" href="./">Go home</a></p>
</body>
</html>
